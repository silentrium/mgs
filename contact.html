<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - Twilight Corner</title>
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/isometric-line/64/purple-moon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS tùy chỉnh riêng cho form liên hệ phù hợp với vibe tối màu */
        .contact-form {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .contact-form label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .contact-form input:focus, .contact-form textarea:focus {
            border-color: var(--accent-glow);
        }
        .contact-form textarea {
            resize: vertical;
            height: 90px;
        }
    </style>
</head>
<body>

    <!-- Thanh điều hướng Header -->
    <header>
        <div class="logo">✨ Twilight Space</div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="about.html">Giới Thiệu</a></li>
                <li><a href="contact.html" class="active">Liên Hệ</a></li>
            </ul>
        </nav>
    </header>

    <!-- Nội dung trang Liên hệ -->
    <main>
        <section class="hero" style="max-width: 500px;">
            <span class="badge">Get in Touch</span>
            <h1>Gửi Lời Nhắn</h1>
            <p>Bạn có góp ý hoặc muốn chia sẻ cảm xúc? Hãy để lại lời nhắn bên dưới nhé.</p>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Họ và tên của bạn:</label>
                    <input type="text" id="name" placeholder="Nhập tên..." required>
                </div>
                <div class="form-group">
                    <label for="email">Địa chỉ Email:</label>
                    <input type="email" id="email" placeholder="Nhập email..." required>
                </div>
                <div class="form-group">
                    <label for="messageBox">Lời nhắn:</label>
                    <textarea id="messageBox" placeholder="Nhập nội dung..." required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px; width: 100%;">Gửi Lời Nhắn</button>
            </form>
            <p id="formResponse" style="margin-top: 15px; font-size: 0.95rem;"></p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Twilight Corner. Designed with ❤️ for relaxed moments.</p>
    </footer>

    <script src="main.js"></script>
    <script>
        // Xử lý thông báo khi gửi form liên hệ
        const contactForm = document.getElementById("contactForm");
        if (contactForm) {
            contactForm.addEventListener("submit", function(e) {
                e.preventDefault();
                const name = document.getElementById("name").value;
                const responseP = document.getElementById("formResponse");
                
                responseP.textContent = `✨ Cảm ơn bạn ${name}! Lời nhắn đã được gửi vào khoảng không vũ trụ.`;
                responseP.style.color = "var(--accent-glow)";
                this.reset();
            });
        }
    </script>
</body>
</html>
